# dsh-crew worker overlay over the official sdk-minimal profile.
# Boot with: node <dsh/lib/bin.js> --profile sdk-minimal --patch worker.cordis.yml
# stdout is reserved for JSON-RPC frames; never add a console logger here.
# Same-id rows replace the base row's whole config; insert rows add Crew-only rows.

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
    streamIdleTimeoutMs: 172800000

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_SANDBOX_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a focused coding worker. Complete the assigned task, then summarize what you did in your final message.'

- id: agent-loop
  config:
    agents: []

- id: sessions
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- insert:
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.8
        retainRatio: 0.16
        maxTokens: 8192
        compactionRetries: 1
